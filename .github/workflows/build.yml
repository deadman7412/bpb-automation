name: Build Multi-Platform

on:
  push:
    branches: [ main, develop, 'codex/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web (Release)
        run: flutter build web --release

      - name: Package web bundle
        run: |
          tar -czf BPB-Automation-Web-${{ steps.version.outputs.version }}.tar.gz -C build/web .
          sha256sum BPB-Automation-Web-${{ steps.version.outputs.version }}.tar.gz > BPB-Automation-Web-${{ steps.version.outputs.version }}.tar.gz.sha256

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: |
            BPB-Automation-Web-${{ steps.version.outputs.version }}.tar.gz
            BPB-Automation-Web-${{ steps.version.outputs.version }}.tar.gz.sha256
          retention-days: 30

  build-server-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup Flutter (for Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build server binaries
        run: |
          mkdir -p server-pkg/bpb-server-linux-x64/bin
          mkdir -p server-pkg/bpb-server-linux-x64/deploy
          (cd backend && dart pub get)
          (cd backend && dart compile exe bin/bpb_api.dart -o ../server-pkg/bpb-server-linux-x64/bin/bpb_api)
          (cd backend && dart compile exe bin/bpb_autoscan.dart -o ../server-pkg/bpb-server-linux-x64/bin/bpb_autoscan)
          cp -R backend/deploy/schedulers server-pkg/bpb-server-linux-x64/deploy/
          cp -R backend/deploy/vps server-pkg/bpb-server-linux-x64/deploy/
          cp backend/README.md server-pkg/bpb-server-linux-x64/README-BACKEND.md
          chmod +x server-pkg/bpb-server-linux-x64/deploy/vps/install_or_update_server.sh

      - name: Package server bundle
        run: |
          tar -czf BPB-Automation-Server-Linux-x64-${{ steps.version.outputs.version }}.tar.gz -C server-pkg bpb-server-linux-x64
          sha256sum BPB-Automation-Server-Linux-x64-${{ steps.version.outputs.version }}.tar.gz > BPB-Automation-Server-Linux-x64-${{ steps.version.outputs.version }}.tar.gz.sha256

      - name: Prepare installer asset
        run: |
          cp backend/deploy/vps/install_or_update_server.sh BPB-Automation-Server-Installer.sh

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: |
            BPB-Automation-Server-Linux-x64-${{ steps.version.outputs.version }}.tar.gz
            BPB-Automation-Server-Linux-x64-${{ steps.version.outputs.version }}.tar.gz.sha256
            BPB-Automation-Server-Installer.sh
          retention-days: 30

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --exclude-tags=integration

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BPB-Automation-Android-Universal-${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/BPB-Automation-Android-Universal-${{ steps.version.outputs.version }}.apk
          retention-days: 30

  # macOS Build
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS (Release)
        run: flutter build macos --release

      - name: Create DMG
        run: |
          # Install create-dmg if not present
          if ! command -v create-dmg &> /dev/null; then
            brew install create-dmg
          fi

          # Create DMG from app bundle
          create-dmg \
            --volname "BPB Automation" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "BPB-Automation-macOS-${{ steps.version.outputs.version }}.dmg" \
            "build/macos/Build/Products/Release/bpb_automation.app" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            BPB-Automation-macOS-${{ steps.version.outputs.version }}.dmg
          retention-days: 30

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            file desktop-file-utils libfuse2 rpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (Release)
        run: flutter build linux --release

      - name: Package as tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.tar.gz *
          cd -
          ls -lh BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.tar.gz

      - name: Create .deb package
        run: |
          set -e
          echo "Creating .deb package structure..."
          mkdir -p debian-pkg/DEBIAN
          mkdir -p debian-pkg/opt/bpb-automation
          mkdir -p debian-pkg/usr/share/applications
          mkdir -p debian-pkg/usr/bin
          
          echo "Copying application files..."
          cp -r build/linux/x64/release/bundle/* debian-pkg/opt/bpb-automation/
          
          echo "Creating desktop file..."
          cat > debian-pkg/usr/share/applications/bpb-automation.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=BPB Automation
          Comment=Cloudflare Clean IP Scanner for BPB Panel
          Exec=/opt/bpb-automation/bpb_automation
          Icon=bpb_automation
          Terminal=false
          Categories=Network;Utility;
          Keywords=cloudflare;scanner;bpb;
          EOF
          
          echo "Creating symlink..."
          ln -s /opt/bpb-automation/bpb_automation debian-pkg/usr/bin/bpb-automation
          
          echo "Creating control file..."
          cat > debian-pkg/DEBIAN/control << 'EOF'
          Package: bpb-automation
          Version: ${{ steps.version.outputs.version }}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: BPB Automation <noreply@example.com>
          Description: Cloudflare Clean IP Scanner for BPB Panel
           Cross-platform automation tool for BPB Panel to automatically
           scan and update clean Cloudflare IPs.
          EOF
          
          echo "Building .deb package..."
          dpkg-deb --build debian-pkg BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.deb
          ls -lh BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.deb
          echo ".deb package created successfully"

      - name: Create .rpm package
        run: |
          set -e
          echo "Creating .rpm package structure..."
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpm-pkg/opt/bpb-automation
          mkdir -p rpm-pkg/usr/share/applications
          
          echo "Copying application files..."
          cp -r build/linux/x64/release/bundle/* rpm-pkg/opt/bpb-automation/
          
          echo "Creating desktop file..."
          cat > rpm-pkg/usr/share/applications/bpb-automation.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=BPB Automation
          Comment=Cloudflare Clean IP Scanner for BPB Panel
          Exec=/opt/bpb-automation/bpb_automation
          Icon=bpb_automation
          Terminal=false
          Categories=Network;Utility;
          Keywords=cloudflare;scanner;bpb;
          EOF
          
          echo "Creating tarball for rpmbuild..."
          tar -czf ~/rpmbuild/SOURCES/bpb-automation-${{ steps.version.outputs.version }}.tar.gz -C rpm-pkg .
          
          echo "Creating spec file..."
          cat > ~/rpmbuild/SPECS/bpb-automation.spec << 'EOF'
          Name:           bpb-automation
          Version:        ${{ steps.version.outputs.version }}
          Release:        1%{?dist}
          Summary:        Cloudflare Clean IP Scanner for BPB Panel
          License:        Proprietary
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      x86_64
          
          %description
          Cross-platform automation tool for BPB Panel to automatically
          scan and update clean Cloudflare IPs.
          
          %prep
          %setup -q -c
          
          %install
          mkdir -p %{buildroot}
          cp -r * %{buildroot}/
          
          %files
          /opt/bpb-automation/*
          /usr/share/applications/bpb-automation.desktop
          
          %changelog
          EOF
          
          echo "Building RPM..."
          rpmbuild -bb ~/rpmbuild/SPECS/bpb-automation.spec
          
          echo "Copying RPM to working directory..."
          cp ~/rpmbuild/RPMS/x86_64/bpb-automation-*.rpm BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.rpm
          ls -lh BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.rpm
          echo ".rpm package created successfully"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.tar.gz
            BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.deb
            BPB-Automation-Linux-x64-${{ steps.version.outputs.version }}.rpm
          retention-days: 30

  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Package as ZIP
        run: |
          cd build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath ..\..\..\..\..\BPB-Automation-Windows-x64-${{ steps.version.outputs.version }}.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            BPB-Automation-Windows-x64-${{ steps.version.outputs.version }}.zip
          retention-days: 30

  # Create GitHub Release (only on tags)
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-web, build-server-linux, build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-app/*.dmg
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-x64/*.deb
            artifacts/linux-x64/*.rpm
            artifacts/windows-x64/*.zip
            artifacts/web-ui/*.tar.gz
            artifacts/web-ui/*.sha256
            artifacts/server-linux-x64/*.tar.gz
            artifacts/server-linux-x64/*.sha256
            artifacts/server-linux-x64/*.sh
          draft: false
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
