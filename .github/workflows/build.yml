name: Build Multi-Platform

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Android Build
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --exclude-tags=integration

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BPB-Automation-Android-Universal.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/BPB-Automation-Android-Universal.apk
          retention-days: 30

  # macOS Build
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS (Debug)
        run: flutter build macos --debug

      - name: Build macOS (Release)
        run: flutter build macos --release

      - name: Create DMG
        run: |
          # Install create-dmg if not present
          if ! command -v create-dmg &> /dev/null; then
            brew install create-dmg
          fi

          # Create DMG from app bundle
          create-dmg \
            --volname "BPB Automation" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "BPB-Automation-macOS.dmg" \
            "build/macos/Build/Products/Release/bpb_automation.app" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            build/macos/Build/Products/Release/bpb_automation.app
            BPB-Automation-macOS.dmg
          retention-days: 30

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            file desktop-file-utils libfuse2 rpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (Release)
        run: flutter build linux --release

      - name: Create .desktop file
        run: |
          mkdir -p packaging/linux
          cat > packaging/linux/bpb-automation.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=BPB Automation
          Comment=Cloudflare Clean IP Scanner for BPB Panel
          Exec=bpb_automation
          Icon=bpb_automation
          Terminal=false
          Categories=Network;Utility;
          Keywords=cloudflare;scanner;bpb;
          EOF

      - name: Package as tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../BPB-Automation-Linux-x64.tar.gz *

      - name: Create AppImage
        run: |
          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy application
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          # Copy desktop file
          cp packaging/linux/bpb-automation.desktop AppDir/usr/share/applications/
          cp packaging/linux/bpb-automation.desktop AppDir/
          
          # Create a simple icon (placeholder)
          echo "Icon placeholder" > AppDir/usr/share/icons/hicolor/256x256/apps/bpb_automation.png
          
          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/bpb_automation" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir BPB-Automation-Linux-x64.AppImage || echo "AppImage creation failed, continuing..."

      - name: Create .deb package
        run: |
          mkdir -p debian-pkg/DEBIAN
          mkdir -p debian-pkg/opt/bpb-automation
          mkdir -p debian-pkg/usr/share/applications
          mkdir -p debian-pkg/usr/bin
          
          # Copy files
          cp -r build/linux/x64/release/bundle/* debian-pkg/opt/bpb-automation/
          cp packaging/linux/bpb-automation.desktop debian-pkg/usr/share/applications/
          
          # Create symlink
          ln -s /opt/bpb-automation/bpb_automation debian-pkg/usr/bin/bpb-automation
          
          # Create control file
          cat > debian-pkg/DEBIAN/control << EOF
          Package: bpb-automation
          Version: 1.0.0
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: BPB Automation <noreply@example.com>
          Description: Cloudflare Clean IP Scanner for BPB Panel
           Cross-platform automation tool for BPB Panel to automatically
           scan and update clean Cloudflare IPs.
          EOF
          
          # Build .deb
          dpkg-deb --build debian-pkg BPB-Automation-Linux-x64.deb

      - name: Create .rpm package
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpm-pkg/opt/bpb-automation
          mkdir -p rpm-pkg/usr/share/applications
          mkdir -p rpm-pkg/usr/bin
          
          # Copy files
          cp -r build/linux/x64/release/bundle/* rpm-pkg/opt/bpb-automation/
          cp packaging/linux/bpb-automation.desktop rpm-pkg/usr/share/applications/
          
          # Create tarball for rpmbuild
          tar -czf ~/rpmbuild/SOURCES/bpb-automation-1.0.0.tar.gz -C rpm-pkg .
          
          # Create spec file
          cat > ~/rpmbuild/SPECS/bpb-automation.spec << 'EOF'
          Name:           bpb-automation
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Cloudflare Clean IP Scanner for BPB Panel
          License:        Proprietary
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      x86_64
          
          %description
          Cross-platform automation tool for BPB Panel to automatically
          scan and update clean Cloudflare IPs.
          
          %prep
          %setup -q -c
          
          %install
          mkdir -p %{buildroot}
          cp -r * %{buildroot}/
          
          %files
          /opt/bpb-automation/*
          /usr/share/applications/bpb-automation.desktop
          
          %changelog
          * $(date "+%a %b %d %Y") BPB Automation <noreply@example.com> - 1.0.0-1
          - Initial RPM release
          EOF
          
          # Build RPM
          rpmbuild -bb ~/rpmbuild/SPECS/bpb-automation.spec || echo "RPM build failed, continuing..."
          
          # Copy RPM to working directory if it was created
          if [ -f ~/rpmbuild/RPMS/x86_64/bpb-automation-1.0.0-1.*.rpm ]; then
            cp ~/rpmbuild/RPMS/x86_64/bpb-automation-1.0.0-1.*.rpm BPB-Automation-Linux-x64.rpm
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            BPB-Automation-Linux-x64.tar.gz
            BPB-Automation-Linux-x64.AppImage
            BPB-Automation-Linux-x64.deb
            BPB-Automation-Linux-x64.rpm
          retention-days: 30

  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Package as ZIP
        run: |
          cd build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath ..\..\..\..\..\BPB-Automation-Windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/windows/x64/runner/Release
            BPB-Automation-Windows-x64.zip
          retention-days: 30

  # Create GitHub Release (only on tags)
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-apk/BPB-Automation-Android-Universal.apk
            artifacts/macos-app/BPB-Automation-macOS.dmg
            artifacts/linux-x64/BPB-Automation-Linux-x64.tar.gz
            artifacts/linux-x64/BPB-Automation-Linux-x64.AppImage
            artifacts/linux-x64/BPB-Automation-Linux-x64.deb
            artifacts/linux-x64/BPB-Automation-Linux-x64.rpm
            artifacts/windows-x64/BPB-Automation-Windows-x64.zip
          draft: false
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
